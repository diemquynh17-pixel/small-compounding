<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Small Compounding</title>
<meta name="description" content="Ghi chú nhanh, việc trong ngày/tuần, sách đọc, nhắc nhở, check thói quen và két mật khẩu mã hóa.">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compounding">
<style>
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface-2:#f0ebe3; --ink:#22201c; --muted:#756e66;
  --line:#e4ddd2; --accent:#2f7a55; --accent-ink:#ffffff; --accent-soft:#e3f0e8;
  --warn:#b5542f; --warn-soft:#f8e6dd; --gold:#b8860b; --bar-prev:#cfc6b8;
  --radius:14px; --shadow:0 1px 2px rgba(40,30,20,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151412; --surface:#1e1c19; --surface-2:#2a2723; --ink:#ece7df; --muted:#a39b91;
    --line:#34302b; --accent:#5fbf8a; --accent-ink:#0f1a14; --accent-soft:#1f3329;
    --warn:#e38a63; --warn-soft:#3a251c; --gold:#e0b44a; --bar-prev:#4a443d; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151412; --surface:#1e1c19; --surface-2:#2a2723; --ink:#ece7df; --muted:#a39b91;
  --line:#34302b; --accent:#5fbf8a; --accent-ink:#0f1a14; --accent-soft:#1f3329;
  --warn:#e38a63; --warn-soft:#3a251c; --gold:#e0b44a; --bar-prev:#4a443d; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:14px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}

/* Header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:30px;height:30px;border-radius:8px}
.brand h1{font-size:17px}
.brand .muted{font-size:12.5px}

main{max-width:980px;margin:0 auto;padding:16px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-head h2{flex:1}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--muted);cursor:pointer;border-radius:10px;min-width:0}
.tabs button .ic{font-size:19px;line-height:1.1;filter:grayscale(1);opacity:.75}
.tabs button.on{color:var(--accent);font-weight:600}
.tabs button.on .ic{filter:none;opacity:1}

@media (min-width:900px){
  body{padding-bottom:0;padding-left:200px}
  .tabs{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:76px 10px 10px;gap:2px}
  .tabs button{flex:0;flex-direction:row;gap:10px;padding:9px 12px;font-size:14px;justify-content:flex-start}
  .tabs button.on{background:var(--accent-soft)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .grid2>section.card{margin-bottom:0}
}

/* Controls */
input[type=text],input[type=password],input[type=url],input[type=number],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:84px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 7px;border-radius:8px;font-size:14px;line-height:1}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
button.chip{cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* Lists */
ul.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.done .grow{color:var(--muted);text-decoration:line-through}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--accent-ink);cursor:pointer;font-weight:800;font-size:16px;display:grid;place-items:center}
.check.sm{width:24px;height:24px;border-radius:7px;font-size:13px}
.done>.check,.check.on{background:var(--accent);border-color:var(--accent)}
.min-in{width:70px!important;flex:none;padding:5px 8px!important;font-size:13px;text-align:right}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}

/* Habits */
.habit{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--surface-2);margin-bottom:8px}
.habit:last-child{margin-bottom:0}
.habit .check{width:36px;height:36px;border-radius:11px;font-size:18px}
.hb-name{font-weight:600}
.mins{display:flex;align-items:center;gap:6px;flex:none}
.mins input{width:64px;padding:6px 8px;text-align:right}
.mins span{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.habit{flex-wrap:wrap}.habit .mins{width:100%;padding-left:48px}.habit .mins input{flex:1;width:auto}}
.progress{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.streak{color:var(--gold);font-weight:600}

/* Notes */
.note{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
.note.pinned{border-color:var(--gold)}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;align-items:center;gap:4px;margin-top:6px}
.tag{color:var(--accent);font-weight:600}

/* Reminders */
.rem.overdue .grow b{color:var(--warn)}

/* Week planner */
.day{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day h3{display:flex;justify-content:space-between;margin-bottom:4px}
.day form{margin-top:6px}
@media (min-width:700px){.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.day{margin-bottom:0}}

/* Week summary */
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav .lbl{flex:1;text-align:center;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.up{color:var(--accent);font-weight:600}.down{color:var(--warn);font-weight:600}.same{color:var(--muted)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wk{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
.wk th,.wk td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
.wk th{font-size:12px;color:var(--muted);font-weight:600}
.wk td:first-child,.wk th:first-child{text-align:left}
.mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2);color:transparent;font-size:12px;font-weight:800}
.mark.on{background:var(--accent);color:var(--accent-ink)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.bars .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars .b{width:42%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.bars .b.prev{background:var(--bar-prev)}
.bars .b.one{width:70%;max-width:34px}
.bars .lb{font-size:11px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.insights{margin:0;padding-left:18px}
.insights li{margin:4px 0}

/* Vault */
.lockbox{max-width:420px;margin:10px auto;text-align:center}
.lockbox .big{font-size:42px}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;text-align:left}
.pw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}

/* Dialog / toast */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:16px;width:min(520px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin-bottom:12px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
label.f>input,label.f>textarea,label.f>select{margin-top:3px;color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:20;
  background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
@media (min-width:900px){#toast{bottom:24px}}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="icons/icon.svg" alt="">
    <div>
      <h1>Small Compounding</h1>
      <div class="muted" id="today-label"></div>
    </div>
  </div>
  <button class="icon" data-a="openSettings" title="Cài đặt, sao lưu" aria-label="Cài đặt">⚙️</button>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Mục">
  <button data-a="tab" data-id="today"><span class="ic">☀️</span>Hôm nay</button>
  <button data-a="tab" data-id="notes"><span class="ic">💭</span>Ghi chú</button>
  <button data-a="tab" data-id="tasks"><span class="ic">✅</span>Việc</button>
  <button data-a="tab" data-id="reading"><span class="ic">📚</span>Sách</button>
  <button data-a="tab" data-id="vault"><span class="ic">🔒</span>Mật khẩu</button>
  <button data-a="tab" data-id="week"><span class="ic">📈</span>Tuần</button>
</nav>

<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div id="toast" role="status"></div>

<script>
'use strict';
/* =========================================================
   Small Compounding — dữ liệu lưu trên chính thiết bị (localStorage).
   Két mật khẩu được mã hóa AES-256-GCM, khóa sinh từ mật khẩu chính bằng PBKDF2.
   ========================================================= */

// ---------- Tiện ích ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
const DOW_FULL = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];
const dowIdx = d => (d.getDay() + 6) % 7;
const fmtDay = s => { const d = parseYmd(s); return `${DOW[dowIdx(d)]} ${d.getDate()}/${d.getMonth() + 1}`; };
const fmtDM = d => `${d.getDate()}/${d.getMonth() + 1}`;
const fmtTime = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${fmtDay(ymd(d))}`; };
const fmtMin = m => { m = Math.round(+m || 0); if (!m) return '0p'; const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? ' ' + r + 'p' : ''}` : `${r}p`; };
const todayStr = () => ymd(new Date());
const localDT = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

// ---------- Dữ liệu ----------
const KEY = 'small-compounding.v1';
function defaultState() {
  return {
    v: 1, notes: [], tasks: [], readings: [], reminders: [], logs: {}, vault: null,
    habits: [
      { id: 'health', name: 'Sức khỏe', icon: '❤️', target: 15 },
      { id: 'gym', name: 'Gym / Tập luyện', icon: '💪', target: 45 },
      { id: 'read', name: 'Đọc sách', icon: '📖', target: 30 }
    ]
  };
}
function load() {
  const raw = lsGet(KEY);
  if (raw) { try { return Object.assign(defaultState(), JSON.parse(raw)); } catch (e) { } }
  return defaultState();
}
let S = load();
function save() { if (!lsSet(KEY, JSON.stringify(S))) toast('⚠️ Không lưu được dữ liệu trên thiết bị này'); }

// ---------- Trạng thái giao diện ----------
let tab = lsGet('sc.tab') || 'today';
let weekOff = 0, planOff = 0, readFilter = 'reading', noteQuery = '', vaultQuery = '';
let V = null;               // két đang mở: { key, items }
const revealed = new Set(); // mật khẩu đang hiện
let lastActive = Date.now();

// ---------- Thống kê ----------
function weekDays(ws) { const a = []; for (let i = 0; i < 7; i++) a.push(ymd(addDays(ws, i))); return a; }
function weekStats(ws) {
  const days = weekDays(ws), set = new Set(days), habits = {};
  S.habits.forEach(h => habits[h.id] = { days: 0, min: 0, marks: [] });
  let perfect = 0;
  const dayMin = days.map(d => {
    const l = S.logs[d] || {}; let m = 0, all = S.habits.length > 0;
    S.habits.forEach(h => {
      const e = l[h.id] || {}, mm = +e.min || 0;
      habits[h.id].min += mm; habits[h.id].marks.push(!!e.done);
      if (e.done) habits[h.id].days++; else all = false;
      m += mm;
    });
    if (all) perfect++;
    return m;
  });
  const tasks = S.tasks.filter(t => set.has(t.date));
  const taskMin = tasks.reduce((a, t) => a + (+t.min || 0), 0);
  const habitMin = dayMin.reduce((a, b) => a + b, 0);
  return {
    days, habits, dayMin, habitMin, taskMin, totalMin: habitMin + taskMin, perfect,
    checks: Object.values(habits).reduce((a, h) => a + h.days, 0),
    tasksDone: tasks.filter(t => t.done).length, tasksTotal: tasks.length,
    booksDone: S.readings.filter(r => r.finished && set.has(r.finished)).length,
    notes: S.notes.filter(n => set.has(ymd(new Date(n.created)))).length
  };
}
function streak(hid) {
  let d = new Date(), n = 0;
  if (!S.logs[ymd(d)]?.[hid]?.done) d = addDays(d, -1);
  while (S.logs[ymd(d)]?.[hid]?.done) { n++; d = addDays(d, -1); }
  return n;
}
function delta(cur, prev, fmt = x => x) {
  const diff = cur - prev;
  if (!cur && !prev) return '<span class="same">—</span>';
  if (diff === 0) return '<span class="same">= tuần trước</span>';
  const pct = prev ? ` (${diff > 0 ? '+' : ''}${Math.round(diff / prev * 100)}%)` : '';
  return `<span class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '↑ +' : '↓ −'}${fmt(Math.abs(diff))}${pct}</span>`;
}

// ---------- Màn hình: Hôm nay ----------
function vToday() {
  const t = todayStr(), log = S.logs[t] || {};
  const done = S.habits.filter(h => log[h.id]?.done).length;
  const ws = weekStats(weekStart(new Date()));
  const habits = S.habits.map(h => {
    const e = log[h.id] || {}, st = streak(h.id);
    const pct = Math.min(100, Math.round((ws.habits[h.id]?.min || 0) / (h.target * 7 || 1) * 100));
    return `<div class="habit ${e.done ? 'done' : ''}">
      <button class="check ${e.done ? 'on' : ''}" data-a="toggleHabit" data-id="${h.id}" aria-label="Check ${esc(h.name)}">${e.done ? '✓' : ''}</button>
      <div class="grow">
        <div class="hb-name">${esc(h.icon)} ${esc(h.name)} ${st ? `<span class="streak small">🔥 ${st} ngày</span>` : ''}</div>
        <div class="muted small">Tuần này ${fmtMin(ws.habits[h.id]?.min)} / ${fmtMin(h.target * 7)}</div>
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>
      <div class="mins">
        <input type="number" inputmode="numeric" min="0" step="5" placeholder="0" value="${e.min || ''}" data-c="habitMin" data-id="${h.id}" aria-label="Số phút ${esc(h.name)}">
        <span>phút</span>
        <button class="btn plain sm" data-a="addMin" data-id="${h.id}">+15</button>
      </div>
    </div>`;
  }).join('');
  const tasks = S.tasks.filter(x => x.date === t);
  const overdue = S.tasks.filter(x => x.date < t && !x.done);
  return `
  <section class="card">
    <div class="card-head"><h2>Daily check</h2><span class="chip ${done === S.habits.length && done ? 'on' : ''}">${done}/${S.habits.length} hoàn thành</span>
      <button class="icon" data-a="editHabits" title="Sửa danh sách thói quen">✏️</button></div>
    ${habits || '<div class="empty">Chưa có thói quen nào. Bấm ✏️ để thêm.</div>'}
  </section>
  <div class="grid2">
    <section class="card">

function checkReminders() {
  const now = Date.now(); let changed = false;
  S.reminders.forEach(r => {
    if (!r.done && !r.notified && new Date(r.at).getTime() <= now) {
      r.notified = true; changed = true; notify('⏰ ' + r.title);
    }
  });
  if (changed) { save(); if (tab === 'today') render(); }
}
async function notify(text) {
  toast(text);
  if (navigator.vibrate) navigator.vibrate(200);
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) reg.showNotification('Small Compounding', { body: text, icon: 'icons/icon-192.png' });
    else new Notification('Small Compounding', { body: text });
  } catch (e) { }
}
function icsFor(r) {
  const d = new Date(r.at), e = new Date(d.getTime() + 15 * 60e3);
  const f = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const clean = s => s.replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const rrule = r.repeat === 'daily' ? 'RRULE:FREQ=DAILY\r\n' : r.repeat === 'weekly' ? 'RRULE:FREQ=WEEKLY\r\n' : '';
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Small Compounding//VI\r\nBEGIN:VEVENT\r\nUID:${r.id}@small-compounding\r\nDTSTAMP:${stamp}\r\nDTSTART:${f(d)}\r\nDTEND:${f(e)}\r\n${rrule}SUMMARY:${clean(r.title)}\r\nBEGIN:VALARM\r\nTRIGGER:-PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:${clean(r.title)}\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
}

// ---------- Két mật khẩu (mã hóa) ----------
const enc = new TextEncoder(), dec = new TextDecoder();
const PBKDF2_ITER = 600000;
function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealVault() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, V.key, enc.encode(JSON.stringify(V.items)));
  S.vault.iv = b64(iv); S.vault.ct = b64(ct); save();
}
async function openVault(pw) {
  const key = await deriveKey(pw, unb64(S.vault.salt), S.vault.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(S.vault.iv) }, key, unb64(S.vault.ct));
  V = { key, items: JSON.parse(dec.decode(pt)) };
}
async function createVault(pw, items = []) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  S.vault = { salt: b64(salt), iter: PBKDF2_ITER };
  V = { key: await deriveKey(pw, salt, PBKDF2_ITER), items };
  await sealVault();
}
function lockVault() { V = null; revealed.clear(); }
function genPassword(len = 18) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*-_=+?';
  const r = crypto.getRandomValues(new Uint32Array(len));
  return Array.from(r, x => chars[x % chars.length]).join('');
}

function vWeek() {
  const ws = addDays(weekStart(new Date()), weekOff * 7);
  const cur = weekStats(ws), prev = weekStats(addDays(ws, -7));
  const maxDay = Math.max(1, ...cur.dayMin, ...prev.dayMin);
  const trend = []; for (let i = 7; i >= 0; i--) { const w = addDays(ws, -7 * i); trend.push({ w, s: weekStats(w) }); }
  const maxTrend = Math.max(1, ...trend.map(x => x.s.totalMin));
  const possible = S.habits.length * 7;

  const insights = [];
  S.habits.forEach(h => {
    const a = cur.habits[h.id], b = prev.habits[h.id], d = a.min - b.min;
    if (d > 0) insights.push(`${h.icon} <b>${esc(h.name)}</b> tăng <span class="up">${fmtMin(d)}</span> so với tuần trước.`);
    else if (d < 0) insights.push(`${h.icon} <b>${esc(h.name)}</b> giảm <span class="down">${fmtMin(-d)}</span> — thử đặt nhắc nhở cố định nhé.`);
    if (a.min >= h.target * 7 && h.target) insights.push(`🎯 Đạt mục tiêu tuần cho <b>${esc(h.name)}</b> (${fmtMin(a.min)} / ${fmtMin(h.target * 7)}).`);
  });
  if (cur.perfect) insights.push(`⭐ Có <b>${cur.perfect}</b> ngày hoàn thành đủ mọi thói quen.`);
  if (!insights.length) insights.push('Chưa có đủ dữ liệu để so sánh. Hãy check mỗi ngày — những bước nhỏ sẽ cộng dồn 🌱');

  return `
  <div class="nav"><button class="btn plain sm" data-a="weekNav" data-id="-1">◀</button>
    <div class="lbl">${fmtDM(ws)} – ${fmtDM(addDays(ws, 6))}${weekOff === 0 ? ' · Tuần này' : ''}</div>
    ${weekOff !== 0 ? '<button class="btn ghost sm" data-a="weekNav" data-id="0">Tuần này</button>' : ''}
    <button class="btn plain sm" data-a="weekNav" data-id="1" ${weekOff >= 0 ? 'disabled style="opacity:.4"' : ''}>▶</button></div>

  <div class="kpis">
    <div class="kpi"><div class="muted small">Tổng thời gian</div><div class="v">${fmtMin(cur.totalMin)}</div><div class="small">${delta(cur.totalMin, prev.totalMin, fmtMin)}</div></div>
    <div class="kpi"><div class="muted small">Lượt check ✓</div><div class="v">${cur.checks}<span class="muted small">/${possible}</span></div><div class="small">${delta(cur.checks, prev.checks)}</div></div>
    <div class="kpi"><div class="muted small">Việc hoàn thành</div><div class="v">${cur.tasksDone}<span class="muted small">/${cur.tasksTotal}</span></div><div class="small">${delta(cur.tasksDone, prev.tasksDone)}</div></div>
    <div class="kpi"><div class="muted small">Sách đọc xong · Ghi chú</div><div class="v">${cur.booksDone} · ${cur.notes}</div><div class="small">${delta(cur.booksDone + cur.notes, prev.booksDone + prev.notes)}</div></div>
  </div>

  <section class="card">
    <div class="card-head"><h2>Check-mark theo ngày</h2></div>
    <div class="scroll-x"><table class="wk">
      <thead><tr><th>Thói quen</th>${DOW.map(d => `<th>${d}</th>`).join('')}<th>Ngày</th><th>Thời gian</th><th>Tuần trước</th><th>Chênh lệch</th></tr></thead>
      <tbody>${S.habits.map(h => {
        const a = cur.habits[h.id], b = prev.habits[h.id];
        return `<tr><td>${esc(h.icon)} ${esc(h.name)}</td>${a.marks.map(m => `<td><span class="mark ${m ? 'on' : ''}">✓</span></td>`).join('')}
          <td><b>${a.days}</b>/7</td><td><b>${fmtMin(a.min)}</b></td><td class="muted">${fmtMin(b.min)} · ${b.days}/7</td><td class="small">${delta(a.min, b.min, fmtMin)}</td></tr>`;
      }).join('')}
      <tr><td><b>Việc (tasks)</b></td>${cur.days.map(d => { const it = S.tasks.filter(x => x.date === d); return `<td class="small muted">${it.length ? `${it.filter(x => x.done).length}/${it.length}` : '·'}</td>`; }).join('')}
        <td><b>${cur.tasksDone}</b>/${cur.tasksTotal}</td><td><b>${fmtMin(cur.taskMin)}</b></td><td class="muted">${fmtMin(prev.taskMin)} · ${prev.tasksDone}/${prev.tasksTotal}</td><td class="small">${delta(cur.taskMin, prev.taskMin, fmtMin)}</td></tr>
      </tbody></table></div>
  </section>

  <div class="grid2">
    <section class="card">
      <div class="card-head"><h2>Thời gian mỗi ngày</h2></div>
      <div class="bars">${cur.dayMin.map((m, i) => `<div class="col" title="${DOW[i]}: ${fmtMin(m)} (tuần trước ${fmtMin(prev.dayMin[i])})">
        <div class="pair"><div class="b prev" style="height:${prev.dayMin[i] / maxDay * 100}%"></div><div class="b" style="height:${m / maxDay * 100}%"></div></div>
        <div class="lb">${DOW[i]}</div></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Tuần này</span><span><i style="background:var(--bar-prev)"></i>Tuần trước</span></div>
    </section>
    <section class="card">
      <div class="card-head"><h2>Xu hướng 8 tuần</h2><span class="muted small">tổng thời gian</span></div>
      <div class="bars">${trend.map((x, i) => `<div class="col" title="Tuần ${fmtDM(x.w)}: ${fmtMin(x.s.totalMin)}">
        <div class="pair"><div class="b one ${i === trend.length - 1 ? '' : 'prev'}" style="height:${x.s.totalMin / maxTrend * 100}%"></div></div>
        <div class="lb">${fmtDM(x.w)}</div></div>`).join('')}</div>
    </section>
  </div>

  <section class="card" style="margin-top:14px">
    <div class="card-head"><h2>Nhận xét</h2></div>
    <ul class="insights">${insights.map(s => `<li>${s}</li>`).join('')}</ul>
  </section>`;
}

// ---------- Hộp thoại ----------
function openDlg(html) { const d = $('#dlg'); d.innerHTML = html; d.showModal(); }
function closeDlg() { $('#dlg').close(); }

function settingsHtml() {
  return `<h2>Cài đặt & sao lưu</h2>
  <div class="stack">
    <p class="muted small" style="margin:0">Dữ liệu chỉ nằm trên thiết bị này. Hãy <b>xuất bản sao lưu</b> thường xuyên, và dùng file đó để chuyển dữ liệu giữa iPhone và Mac. Két mật khẩu vẫn được mã hóa bên trong file sao lưu.</p>
    <button class="btn" data-a="exportData">⬇️ Xuất bản sao lưu (.json)</button>
    <button class="btn plain" data-a="importData">⬆️ Nhập từ bản sao lưu</button>
    <button class="btn plain" data-a="editHabits">✏️ Sửa danh sách thói quen</button>
    <button class="btn plain" data-a="persist">💾 Yêu cầu trình duyệt giữ dữ liệu lâu dài</button>
    <div class="row"><button class="btn danger sm" data-a="wipe">Xóa toàn bộ dữ liệu</button><span class="grow"></span><button class="btn ghost" data-a="closeDlg">Đóng</button></div>
  </div>`;
}
function habitsDlgHtml() {
  return `<h2>Thói quen hằng ngày</h2>
  <form data-f="saveHabits" class="stack">
    ${S.habits.map((h, i) => `<div class="row" data-hrow>
      <input type="text" name="icon_${i}" value="${esc(h.icon)}" style="width:52px;flex:none;text-align:center" aria-label="Biểu tượng">
      <input type="text" name="name_${i}" value="${esc(h.name)}" required aria-label="Tên">
      <input type="number" name="target_${i}" value="${h.target}" min="0" step="5" style="width:80px;flex:none" aria-label="Mục tiêu phút/ngày" title="Mục tiêu phút mỗi ngày">
      <input type="hidden" name="id_${i}" value="${h.id}">
      <button type="button" class="icon" data-a="rmHabitRow" title="Xóa">✕</button></div>`).join('')}
    <div class="row" data-hrow>
      <input type="text" name="icon_new" placeholder="🧘" style="width:52px;flex:none;text-align:center">
      <input type="text" name="name_new" placeholder="Thói quen mới (vd: Thiền)">
      <input type="number" name="target_new" placeholder="phút" min="0" step="5" style="width:80px;flex:none">
      <span style="width:30px"></span></div>
    <p class="muted small" style="margin:0">Số bên phải là mục tiêu phút mỗi ngày (dùng để tính % tuần).</p>
    <div class="row"><span class="grow"></span><button type="button" class="btn ghost" data-a="closeDlg">Hủy</button><button class="btn">Lưu</button></div>
  </form>`;
}
function vaultItemDlg(it) {
  it = it || { id: '', site: '', user: '', pass: '', note: '' };
  return `<h2>${it.id ? 'Sửa' : 'Thêm'} mật khẩu</h2>
  <form data-f="vaultSave" class="stack">
    <input type="hidden" name="id" value="${it.id}">
    <label class="f">Tên / trang web<input type="text" name="site" value="${esc(it.site)}" required autocomplete="off"></label>
    <label class="f">Tài khoản / email<input type="text" name="user" value="${esc(it.user)}" autocomplete="off"></label>
    <label class="f">Mật khẩu<div class="row" style="margin-top:3px"><input type="text" name="pass" id="passIn" value="${esc(it.pass)}" required autocomplete="off" class="pw">
      <button type="button" class="btn plain sm" data-a="genPass">🎲 Tạo</button></div></label>
    <label class="f">Ghi chú<textarea name="note" style="min-height:60px">${esc(it.note)}</textarea></label>
    <div class="row">${it.id ? `<button type="button" class="btn danger sm" data-a="vaultDel" data-id="${it.id}">Xóa</button>` : ''}<span class="grow"></span>
      <button type="button" class="btn ghost" data-a="closeDlg">Hủy</button><button class="btn">Lưu</button></div>
  </form>`;
}

// ---------- Hành động (bấm nút) ----------
const findTask = id => S.tasks.find(x => x.id === id);
const A = {
  tab(id) { tab = id; lsSet('sc.tab', id); render(); window.scrollTo(0, 0); },
  toggleHabit(id) {
    const t = todayStr(); S.logs[t] = S.logs[t] || {};
    const e = S.logs[t][id] = S.logs[t][id] || {}; e.done = !e.done;
    if (e.done && !e.min) { const h = S.habits.find(h => h.id === id); if (h?.target) e.min = h.target; }
    save(); render();
  },
  addMin(id) {
    const t = todayStr(); S.logs[t] = S.logs[t] || {};
    const e = S.logs[t][id] = S.logs[t][id] || {}; e.min = (+e.min || 0) + 15; e.done = true; save(); render();
  },
  toggleTask(id) { const x = findTask(id); x.done = !x.done; x.doneAt = x.done ? Date.now() : null; save(); render(); },
  moveTask(id) { const x = findTask(id); x.date = ymd(addDays(parseYmd(x.date), 1)); save(); render(); toast(`Đã dời sang ${fmtDay(x.date)}`); },
  delTask(id) { S.tasks = S.tasks.filter(x => x.id !== id); save(); render(); },
  rollover() { const t = todayStr(); let n = 0; S.tasks.forEach(x => { if (x.date < t && !x.done) { x.date = t; n++; } }); save(); render(); toast(`Đã dời ${n} việc sang hôm nay`); },
  planNav(id) { planOff = id === '0' ? 0 : planOff + Number(id); render(); },
  weekNav(id) { weekOff = id === '0' ? 0 : Math.min(0, weekOff + Number(id)); render(); },

  async askNotify() { try { await Notification.requestPermission(); } catch (e) { } render(); },
  doneReminder(id) {
    const r = S.reminders.find(x => x.id === id);
    if (r.repeat === 'none') r.done = true;
    else { let d = new Date(r.at); const step = r.repeat === 'daily' ? 1 : 7; do d = addDays(d, step); while (d.getTime() <= Date.now()); r.at = localDT(d); r.notified = false; }
    save(); render();
  },
  delReminder(id) { S.reminders = S.reminders.filter(x => x.id !== id); save(); render(); },
  icsReminder(id) { const r = S.reminders.find(x => x.id === id); download(`nhac-nho-${r.title.slice(0, 20).replace(/[^\p{L}\p{N}]+/gu, '-')}.ics`, icsFor(r), 'text/calendar'); },

  tagFilter(t) { noteQuery = noteQuery.toLowerCase() === t ? '' : t; render(); },
  pinNote(id) { const n = S.notes.find(x => x.id === id); n.pinned = !n.pinned; save(); render(); },
  copyNote(id) { copyText(S.notes.find(x => x.id === id).text, 'ghi chú'); },
  editNote(id) {
    const n = S.notes.find(x => x.id === id);
    openDlg(`<h2>Sửa ghi chú</h2><form data-f="saveNote" class="stack"><input type="hidden" name="id" value="${id}">
      <textarea name="text" style="min-height:180px" required>${esc(n.text)}</textarea>
      <div class="row"><span class="grow"></span><button type="button" class="btn ghost" data-a="closeDlg">Hủy</button><button class="btn">Lưu</button></div></form>`);
  },
  delNote(id) { if (confirm('Xóa ghi chú này?')) { S.notes = S.notes.filter(x => x.id !== id); save(); render(); } },

  readFilter(id) { readFilter = id; render(); },
  delReading(id) { if (confirm('Xóa khỏi danh sách?')) { S.readings = S.readings.filter(x => x.id !== id); save(); render(); } },
  noteReading(id) {
    const r = S.readings.find(x => x.id === id);
    openDlg(`<h2>${esc(r.title)}</h2><form data-f="saveReadingNote" class="stack"><input type="hidden" name="id" value="${id}">
      <textarea name="note" placeholder="Ý chính, cảm nhận, trích dẫn hay…">${esc(r.note || '')}</textarea>
      <div class="row"><span class="grow"></span><button type="button" class="btn ghost" data-a="closeDlg">Hủy</button><button class="btn">Lưu</button></div></form>`);
  },

  vaultLock() { lockVault(); render(); },
  vaultReveal(id) { revealed.has(id) ? revealed.delete(id) : revealed.add(id); $('#vaultList').innerHTML = vaultListHtml(); },
  vaultCopyUser(id) { copyText(V.items.find(x => x.id === id).user, 'tài khoản'); },
  vaultCopyPass(id) { copyText(V.items.find(x => x.id === id).pass, 'mật khẩu'); },
  vaultEdit(id) { openDlg(vaultItemDlg(id ? V.items.find(x => x.id === id) : null)); },
  genPass() { $('#passIn').value = genPassword(); },
  async vaultDel(id) { if (!confirm('Xóa mật khẩu này?')) return; V.items = V.items.filter(x => x.id !== id); await sealVault(); closeDlg(); render(); },
  vaultChangePw() {
    openDlg(`<h2>Đổi mật khẩu chính</h2><form data-f="vaultNewPw" class="stack">
      <input type="password" name="pw" placeholder="Mật khẩu chính mới" minlength="8" required autocomplete="new-password">
      <input type="password" name="pw2" placeholder="Nhập lại" minlength="8" required autocomplete="new-password">
      <div class="row"><span class="grow"></span><button type="button" class="btn ghost" data-a="closeDlg">Hủy</button><button class="btn">Đổi</button></div></form>`);
  },

  openSettings() { openDlg(settingsHtml()); },
  editHabits() { openDlg(habitsDlgHtml()); },
  rmHabitRow(_, b) { b.closest('[data-hrow]').remove(); },
  closeDlg,
  exportData() { download(`small-compounding-${todayStr()}.json`, JSON.stringify(S, null, 1), 'application/json'); toast('Đã xuất bản sao lưu'); },
  importData() { $('#importFile').click(); },
  async persist() {
    if (navigator.storage?.persist) { const ok = await navigator.storage.persist(); toast(ok ? 'Trình duyệt sẽ giữ dữ liệu lâu dài ✓' : 'Trình duyệt chưa cho phép — hãy cài app ra màn hình chính'); }
    else toast('Trình duyệt không hỗ trợ tính năng này');
  },
  wipe() { if (confirm('Xóa TOÀN BỘ dữ liệu trên thiết bị này? Không thể hoàn tác.') && confirm('Chắc chắn chứ? Hãy xuất bản sao lưu trước nếu cần.')) { S = defaultState(); lockVault(); save(); closeDlg(); render(); } }
};

// ---------- Thay đổi ô nhập ----------
const C = {
  habitMin(id, el) {
    const t = todayStr(); S.logs[t] = S.logs[t] || {};
    const e = S.logs[t][id] = S.logs[t][id] || {}; e.min = Math.max(0, +el.value || 0); if (e.min > 0) e.done = true; save(); render();
  },
  taskMin(id, el) { findTask(id).min = Math.max(0, +el.value || 0); save(); },
  readStatus(id, el) {
    const r = S.readings.find(x => x.id === id); r.status = el.value;
    r.finished = r.status === 'done' ? (r.finished || todayStr()) : null; save(); render();
  }
};

// ---------- Gửi form ----------
const F = {
  addTask(fd) { S.tasks.push({ id: uid(), title: fd.get('title').trim(), date: fd.get('date'), done: false, min: 0, created: Date.now() }); save(); render(); focusSame('addTask', fd.get('date')); },
  addNote(fd) { const text = fd.get('text').trim(); if (!text) return; S.notes.push({ id: uid(), text, created: Date.now(), pinned: false }); save(); render(); toast('Đã lưu ghi chú ✓'); },
  saveNote(fd) { S.notes.find(x => x.id === fd.get('id')).text = fd.get('text').trim(); save(); closeDlg(); render(); },
  addReminder(fd) { S.reminders.push({ id: uid(), title: fd.get('title').trim(), at: fd.get('at'), repeat: fd.get('repeat'), done: false, notified: false }); save(); render(); toast('Đã thêm nhắc nhở'); },
  addReading(fd) {
    const status = fd.get('status');
    S.readings.push({ id: uid(), title: fd.get('title').trim(), author: fd.get('author').trim(), link: fd.get('link').trim(), status, note: '', added: Date.now(), finished: status === 'done' ? todayStr() : null });
    readFilter = status; save(); render();
  },
  saveReadingNote(fd) { S.readings.find(x => x.id === fd.get('id')).note = fd.get('note').trim(); save(); closeDlg(); render(); },
  saveHabits(fd, form) {
    const list = [];
    for (const [k, v] of fd.entries()) {
      const m = k.match(/^id_(\d+)$/); if (!m) continue;
      const i = m[1]; list.push({ id: v, name: fd.get('name_' + i).trim(), icon: fd.get('icon_' + i).trim() || '•', target: Math.max(0, +fd.get('target_' + i) || 0) });
    }
    const nn = (fd.get('name_new') || '').trim();
    if (nn) list.push({ id: uid(), name: nn, icon: (fd.get('icon_new') || '').trim() || '•', target: Math.max(0, +fd.get('target_new') || 0) });
    S.habits = list; save(); closeDlg(); render(); toast('Đã lưu thói quen');
  },
  async vaultCreate(fd) {
    if (fd.get('pw') !== fd.get('pw2')) return toast('Hai mật khẩu không khớp');
    await createVault(fd.get('pw')); render(); toast('Đã tạo két 🔐');
  },
  async vaultUnlock(fd, form) {
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Đang mở…';
    try { await openVault(fd.get('pw')); lastActive = Date.now(); render(); }
    catch (e) { btn.disabled = false; btn.textContent = 'Mở khóa'; toast('Sai mật khẩu chính'); }
  },
  async vaultSave(fd) {
    const it = { id: fd.get('id') || uid(), site: fd.get('site').trim(), user: fd.get('user').trim(), pass: fd.get('pass'), note: fd.get('note').trim(), updated: Date.now() };
    const i = V.items.findIndex(x => x.id === it.id); if (i >= 0) V.items[i] = it; else V.items.push(it);
    await sealVault(); closeDlg(); render(); toast('Đã lưu (mã hóa) ✓');
  },
  async vaultNewPw(fd) {
    if (fd.get('pw') !== fd.get('pw2')) return toast('Hai mật khẩu không khớp');
    await createVault(fd.get('pw'), V.items); closeDlg(); render(); toast('Đã đổi mật khẩu chính');
  }
};
function focusSame(form, date) {
  const el = document.querySelector(`form[data-f="${form}"] input[name="date"][value="${date}"]`);
  el?.parentElement.querySelector('input[name="title"]')?.focus();
}

// ---------- Kết nối sự kiện ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || !A[b.dataset.a]) return;
  e.preventDefault(); A[b.dataset.a](b.dataset.id, b);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el.dataset.id, el); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault(); F[f.dataset.f](new FormData(f), f); });
document.addEventListener('input', e => {
  if (e.target.id === 'noteQ') { noteQuery = e.target.value; $('#noteList').innerHTML = noteListHtml(); }
  if (e.target.id === 'vaultQ') { vaultQuery = e.target.value; $('#vaultList').innerHTML = vaultListHtml(); }
});
document.addEventListener('keydown', e => {
  lastActive = Date.now();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.tagName === 'TEXTAREA') e.target.form?.requestSubmit();
});
document.addEventListener('pointerdown', () => lastActive = Date.now());
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) closeDlg(); });
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.habits) || typeof data.logs !== 'object') throw new Error('bad');
    if (!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu này?')) return;
    S = Object.assign(defaultState(), data); lockVault(); save(); closeDlg(); render(); toast('Đã nhập dữ liệu ✓');
  } catch (err) { toast('File sao lưu không hợp lệ'); }
});
// Tự khóa két: rời app hoặc 3 phút không thao tác.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && V) { lockVault(); if (tab === 'vault') render(); }
  if (!document.hidden) { checkReminders(); render(); }
});
setInterval(() => {
  if (V && Date.now() - lastActive > 180e3) { lockVault(); closeDlg(); if (tab === 'vault') render(); toast('Két đã tự khóa'); }
  checkReminders();
}, 15e3);

// ---------- Vẽ màn hình ----------
const VIEWS = { today: vToday, notes: vNotes, tasks: vTasks, reading: vReading, vault: vVault, week: vWeek };
function render() {
  if (!VIEWS[tab]) tab = 'today';
  const d = new Date();
  $('#today-label').textContent = `${DOW_FULL[dowIdx(d)]}, ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === tab));
  $('#view').innerHTML = VIEWS[tab]();
}
render();
checkReminders();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
</script>
</body>
</html>
