<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Small Compounding</title>
<meta name="description" content="Ghi chú nhanh, việc trong ngày/tuần, sách đọc, nhắc nhở, check thói quen và két mật khẩu mã hóa.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compounding">
<style>
/* Hướng thiết kế: taste-skill (Leonxlnx/taste-skill) cho màn hình app, style "editorial-greeting":
   lời chào là tiêu đề, cột giữa 12 cột, mọi con số ở độ đậm thường trên các panel một tông.
   Màu chủ đạo xanh lá đặt trên dữ liệu (check, tuần này, đường cộng dồn) và một nút chính. */
:root{
  --ground:#ffffff; --surface:#f3f6f2; --raised:#ffffff; --active:#e7ece5;
  --border:#e3e8e1; --rule:#e2e7e0; --control:#d3d9d0;
  --text:#1c1f1b; --muted:#5b6159; --faint:#686d66;
  --accent:#2f7a55; --accent-ink:#ffffff; --accent-soft:#dcefe3; --accent-deep:#1f5a3d;
  --positive:#2f7a55; --negative:#b42318; --neg-soft:#fdecea; --neg-ink:#7a1d14;
  --grid:#e1e6df; --prev:#c4cbc1;
  --radius-card:22px; --radius-inner:12px; --gap:16px; --pad:20px; --control-h:38px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111311; --surface:#1a1d1a; --raised:#222622; --active:#272b27;
    --border:#2b302b; --rule:#2a2e2a; --control:#3d433d;
    --text:#f1f3f0; --muted:#b4b9b2; --faint:#959a93;
    --accent:#5cc28c; --accent-ink:#0c1a12; --accent-soft:#1c3427; --accent-deep:#8fd9b1;
    --positive:#5cc28c; --negative:#ef6b5b; --neg-soft:#3a1f1b; --neg-ink:#ffb4a8;
    --grid:#2a2e2a; --prev:#4a504a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111311; --surface:#1a1d1a; --raised:#222622; --active:#272b27;
  --border:#2b302b; --rule:#2a2e2a; --control:#3d433d;
  --text:#f1f3f0; --muted:#b4b9b2; --faint:#959a93;
  --accent:#5cc28c; --accent-ink:#0c1a12; --accent-soft:#1c3427; --accent-deep:#8fd9b1;
  --positive:#5cc28c; --negative:#ef6b5b; --neg-soft:#3a1f1b; --neg-ink:#ffb4a8;
  --grid:#2a2e2a; --prev:#4a504a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--accent-deep)}
.num{font-variant-numeric:tabular-nums}
.unit{color:var(--muted);font-size:.6em;margin-left:1px}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:16px}
.i{flex:none;display:block}

/* ---------- Khung (shell) ---------- */
.side{display:none}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:calc(52px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 10px 0 16px;background:var(--ground);border-bottom:1px solid var(--rule)}
.topbar .mark{width:24px;height:24px;border-radius:7px}
.topbar .name{flex:1;font-weight:600;font-size:16px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--ground);border-top:1px solid var(--rule);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.bottombar button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0 5px;color:var(--muted);font-size:11px;line-height:14px;cursor:pointer;border-radius:12px}
.bottombar button.on{color:var(--text);font-weight:500}
.bottombar button.on .i{color:var(--accent)}
main{padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
.canvas{max-width:1100px;margin:0 auto}

@media (min-width:960px){
  body{display:grid;grid-template-columns:224px 1fr}
  .topbar,.bottombar{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 12px 16px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
  .brand img{width:28px;height:28px;border-radius:8px}
  .brand b{font-weight:600;font-size:15px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:10px;background:none;
    color:var(--text);cursor:pointer;text-align:left;font-size:14px}
  .nav button .i{color:var(--muted)}
  .nav button:hover{background:var(--surface)}
  .nav button.on{background:var(--active)}
  .nav button.on .i{color:var(--accent)}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
  main{padding:36px 40px 64px}
}
/* Lưới: 12 cột trong cột giữa 1100px. 12 × 78.33 + 11 × 16 = 1100. */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);align-items:start}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}
@media (max-width:1099px){.s8,.s4{grid-column:span 12}}
@media (max-width:759px){.s6{grid-column:span 12}}
.stack{display:flex;flex-direction:column;gap:var(--gap)}

/* ---------- Tiêu đề màn hình ---------- */
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.head .t{flex:1 1 320px;min-width:0}
.head h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.01em}
.head h1.greet{font-family:var(--serif);font-weight:400;font-size:30px;line-height:34px;letter-spacing:-.015em}
.head .sub{margin-top:6px;font-size:15px;line-height:22px;color:var(--muted)}
.head .acts{display:flex;gap:8px;align-items:center}
@media (min-width:960px){.head h1.greet{font-size:44px;line-height:48px}.head{margin-bottom:28px}}

/* ---------- Panel ---------- */
.panel{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:28px}
.ph h2{flex:1;font-size:16px;line-height:22px;font-weight:600}
.ph .meta{color:var(--muted);font-size:13px}
.inner{background:var(--raised);border-radius:var(--radius-inner);padding:16px}

/* ---------- Nút & ô nhập ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-h);padding:0 16px;border-radius:999px;
  border:1px solid var(--control);background:var(--raised);color:var(--text);font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
:root[data-theme="dark"] .btn.primary:hover{color:var(--ground)}
.btn.text{border-color:transparent;background:none;padding:0 8px;color:var(--text)}
.btn.text:hover{background:var(--active)}
.btn.danger{color:var(--negative);border-color:var(--negative);background:none}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.ib{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--active);color:var(--text)}
.ib.on{color:var(--accent)}
.ib.warn{color:var(--negative)}
input[type=text],input[type=password],input[type=url],input[type=number],input[type=datetime-local],input[type=search],select,textarea{
  height:var(--control-h);width:100%;min-width:0;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:var(--raised);outline:none}
select{padding-right:8px}
textarea{height:auto;min-height:96px;padding:12px 14px;border-radius:14px;resize:vertical;line-height:20px}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-weight:500;margin-bottom:16px}
label.f>input,label.f>textarea,label.f>select,label.f>.row{margin-top:8px}
label.f .help{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:6px}

/* ---------- Danh sách ---------- */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0;border-top:1px solid var(--rule)}
.li:first-child{border-top:0}
.li .t1{overflow-wrap:anywhere}
.li .t2{color:var(--muted);font-size:13px;line-height:18px;margin-top:2px}
.li.done .t1{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--prev)}
.empty{border:1px dashed var(--control);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:13px}
.ck{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:999px;border:1.5px solid var(--control);background:var(--raised);color:transparent;cursor:pointer;padding:0}
.ck:hover{border-color:var(--accent)}
.ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mins{display:flex;align-items:center;gap:6px;flex:none}
.mins input{width:64px;height:32px;padding:0 10px;text-align:right}
.mins .u{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--active);color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.chip.ok{background:var(--accent-soft);color:var(--accent-deep)}
.chip.bad{background:var(--neg-soft);color:var(--neg-ink)}

/* ---------- Daily check ---------- */
.habit{display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--rule)}
.habit:first-of-type{border-top:0;padding-top:4px}
.habit .ck{width:40px;height:40px}
.habit .nm{font-size:16px;line-height:22px;font-weight:500}
.habit .mt{color:var(--muted);font-size:13px;line-height:18px;margin-top:2px}
.strip{display:flex;gap:4px}
.strip i{width:14px;height:14px;border-radius:4px;background:var(--active)}
.strip i.on{background:var(--accent)}
.strip i.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.strip i.on.today{box-shadow:none}
@media (max-width:600px){
  .habit{grid-template-columns:40px 1fr;row-gap:10px}
  .habit .strip{grid-column:2}
  .habit .mins{grid-column:2;justify-self:start}
}
.kv{display:flex;flex-direction:column}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{font-size:24px;line-height:30px;margin-top:2px}
.kv .v.lead{font-size:32px;line-height:38px}
.kv .d{font-size:13px;margin-top:2px}
.kvs{display:flex;flex-direction:column;gap:18px}
.up{color:var(--positive)}.down{color:var(--negative)}.same{color:var(--muted)}

/* ---------- Ghi chú ---------- */
.note{padding:14px 0;border-top:1px solid var(--rule)}
.note:first-child{border-top:0;padding-top:2px}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:23px}
.note .meta{display:flex;align-items:center;gap:2px;margin-top:6px;color:var(--muted);font-size:12px}
.note .meta .when{flex:1}
.tag{color:var(--accent-deep);font-weight:500}
.tags{display:flex;flex-direction:column}
.tags button{display:flex;align-items:center;height:34px;padding:0 10px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--text);text-align:left}
.tags button span:first-child{flex:1}
.tags button.on{background:var(--active)}
@media (max-width:1099px){.tags{flex-direction:row;overflow-x:auto;gap:6px}.tags button{flex:none;background:var(--raised)}.tags button span:first-child{margin-right:6px}}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--rule);margin-bottom:8px;overflow-x:auto}
.tabs button{flex:none;border:0;background:none;padding:8px 0 10px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--accent);font-weight:500}

/* ---------- Tuần ---------- */
.strip4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:var(--radius-card)}
.strip4>div{padding:18px 20px;border-left:1px solid var(--rule)}
.strip4>div:first-child{border-left:0}
@media (max-width:759px){.strip4{grid-template-columns:1fr 1fr}.strip4>div:nth-child(3){border-left:0}.strip4>div:nth-child(n+3){border-top:1px solid var(--rule)}}
.wk{display:grid;grid-template-columns:minmax(140px,1fr) repeat(7,26px) 56px 76px 104px 116px;align-items:center;column-gap:10px}
.wk.h{color:var(--muted);font-size:12px;padding-bottom:8px}
.wk.r{min-height:48px;border-top:1px solid var(--rule);padding:6px 0}
.wk .c{text-align:center}.wk .n{text-align:right}
.mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--active);color:transparent}
.mk.on{background:var(--accent);color:var(--accent-ink)}
.wk .l2{display:none}
@media (max-width:899px){
  .wk.h{display:none}
  .wk{grid-template-columns:1fr auto;row-gap:6px}
  .wk .c,.wk .hide{display:none}
  .wk .l2{display:flex;grid-column:1 / -1;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .wk .l2 .marks{display:flex;gap:4px}
}
.chart{width:100%;min-height:190px}
.chart svg{display:block;overflow:visible}
.chart .g{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--control);stroke-width:1.5}
.chart .tk{fill:var(--muted);font-size:11px}
.chart .c{fill:var(--accent)}
.chart .p{fill:var(--prev)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--accent)}
.chart .lab{fill:var(--text);font-size:12px}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.insights{margin:0;padding-left:18px;line-height:22px}
.insights li+li{margin-top:6px}

/* ---------- Cài đặt ---------- */
.set{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px;padding:28px 0;border-top:1px solid var(--rule)}
.set:first-of-type{border-top:0;padding-top:0}
.set .lbl h2{font-size:16px;line-height:22px;font-weight:600}
.set .lbl p{color:var(--muted);margin-top:6px;line-height:21px}
@media (max-width:899px){.set{grid-template-columns:1fr;gap:12px}}
.steps{margin:0 0 18px;padding-left:20px;line-height:22px}
.steps li+li{margin-top:6px}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--raised);margin-bottom:14px}
.status .dot{width:8px;height:8px;border-radius:999px;background:var(--accent);flex:none}
.status.err .dot{background:var(--negative)}
.status.busy .dot{background:var(--prev)}

/* ---------- Két ---------- */
.pw{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lockp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:759px){.lockp{grid-template-columns:1fr}}
.notice{background:var(--neg-soft);color:var(--neg-ink);border-radius:12px;padding:10px 14px;font-size:13px;line-height:19px;margin-bottom:16px}

/* ---------- Hộp thoại & thông báo ---------- */
dialog{border:0;border-radius:22px;background:var(--ground);color:var(--text);padding:22px;width:min(520px,calc(100vw - 32px));max-height:86vh;box-shadow:0 18px 48px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(17,19,17,.4)}
dialog h2{font-size:18px;line-height:24px;font-weight:600;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,8px);z-index:20;background:var(--text);color:var(--ground);
  padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){#toast{bottom:28px;left:calc(50% + 112px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hidden{display:none!important}
</style>
</head>
<body>

<aside class="side" aria-label="Điều hướng">
  <div class="brand"><img src="icons/icon.svg" alt=""><b>Small Compounding</b></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="foot nav" id="sideFoot"></div>
</aside>

<header class="topbar">
  <img class="mark" src="icons/icon.svg" alt="">
  <span class="name" id="topName"></span>
  <span id="topActs" class="row" style="gap:0"></span>
</header>

<main><div class="canvas" id="view"></div></main>

<nav class="bottombar" id="bottomNav" aria-label="Điều hướng"></nav>

<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div id="toast" role="status" aria-live="polite"></div>

<script src="icons.js"></script>
<script>
'use strict';
/* =========================================================
   Small Compounding
   - Dữ liệu lưu trên máy (localStorage).
   - Két mật khẩu: AES-256-GCM, khóa sinh từ mật khẩu chính bằng PBKDF2.
   - Đồng bộ: toàn bộ dữ liệu được mã hóa trên máy rồi lưu vào một gist bí mật
     trong tài khoản GitHub của người dùng. Mỗi bản ghi có dấu thời gian `u`
     để gộp dữ liệu giữa hai máy; bản ghi bị xóa được ghi lại trong `del`.
   ========================================================= */

// ---------- Tiện ích ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
const DOW_FULL = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];
const dowIdx = d => (d.getDay() + 6) % 7;
const fmtDM = d => `${d.getDate()}/${d.getMonth() + 1}`;
const fmtDay = s => { const d = parseYmd(s); return `${DOW[dowIdx(d)]} ${fmtDM(d)}`; };
const fmtTime = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${fmtDay(ymd(d))}`; };
const fmtClock = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function normalize(s) {

}

function weekDays(ws) { const a = []; for (let i = 0; i < 7; i++) a.push(ymd(addDays(ws, i))); return a; }
function weekStats(ws) {
  const days = weekDays(ws), set = new Set(days), habits = {};
  S.habits.forEach(h => habits[h.id] = { days: 0, min: 0, marks: [] });
  let perfect = 0;
  const dayMin = days.map(d => {
    const l = S.logs[d] || {}; let m = 0, all = S.habits.length > 0;
    S.habits.forEach(h => {
      const e = l[h.id] || {}, mm = +e.min || 0;
      habits[h.id].min += mm; habits[h.id].marks.push(!!e.done);
      if (e.done) habits[h.id].days++; else all = false;
      m += mm;
    });
    S.tasks.forEach(t => { if (t.date === d) m += +t.min || 0; });
    if (all) perfect++;
    return m;
  });
  const tasks = S.tasks.filter(t => set.has(t.date));
  const taskMin = tasks.reduce((a, t) => a + (+t.min || 0), 0);
  const totalMin = dayMin.reduce((a, b) => a + b, 0);
  return {
    days, habits, dayMin, taskMin, totalMin, habitMin: totalMin - taskMin, perfect,
    checks: Object.values(habits).reduce((a, h) => a + h.days, 0),
    tasksDone: tasks.filter(t => t.done).length, tasksTotal: tasks.length,
    booksDone: S.readings.filter(r => r.finished && set.has(r.finished)).length,
    notes: S.notes.filter(n => set.has(ymd(new Date(n.created)))).length
  };
}
function totalUpTo(endYmd) {
  let m = 0;
  for (const d in S.logs) if (d <= endYmd) for (const h in S.logs[d]) m += +S.logs[d][h].min || 0;
  S.tasks.forEach(t => { if (t.date <= endYmd) m += +t.min || 0; });
  return m;
}
function streak(hid) {
  let d = new Date(), n = 0;
  if (!S.logs[ymd(d)]?.[hid]?.done) d = addDays(d, -1);
  while (S.logs[ymd(d)]?.[hid]?.done) { n++; d = addDays(d, -1); }
  return n;
}
// Màu nói tốt/xấu: với mọi chỉ số ở đây, tăng là tốt. Không đổi thì màu xám.
function delta(cur, prev, fmt = x => x) {
  if (!cur && !prev) return '<span class="same">—</span>';
  const diff = cur - prev;
  if (diff === 0) return '<span class="same">bằng tuần trước</span>';
  if (!prev) return `<span class="up">+${fmt(cur)} (mới)</span> <span class="same">so với tuần trước</span>`;
  const pct = Math.round(diff / prev * 100);
  return `<span class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : '−'}${fmt(Math.abs(diff))} (${diff > 0 ? '+' : '−'}${Math.abs(pct)}%)</span> <span class="same">so với tuần trước</span>`;
}

function checkReminders() {

  S.reminders.forEach(r => {

async function notify(text) {
  toast('Nhắc nhở: ' + text);
  if (navigator.vibrate) navigator.vibrate(200);
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) reg.showNotification('Small Compounding', { body: text, icon: 'icons/icon-192.png' });
    else new Notification('Small Compounding', { body: text });
  } catch (e) { }
}
function icsFor(r) {
  const d = new Date(r.at), e = new Date(d.getTime() + 15 * 60e3);
  const f = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const clean = s => s.replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const rrule = r.repeat === 'daily' ? 'RRULE:FREQ=DAILY\r\n' : r.repeat === 'weekly' ? 'RRULE:FREQ=WEEKLY\r\n' : '';
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Small Compounding//VI\r\nBEGIN:VEVENT\r\nUID:${r.id}@small-compounding\r\nDTSTAMP:${stamp}\r\nDTSTART:${f(d)}\r\nDTEND:${f(e)}\r\n${rrule}SUMMARY:${clean(r.title)}\r\nBEGIN:VALARM\r\nTRIGGER:-PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:${clean(r.title)}\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
}

// ---------- Mã hóa ----------
const enc = new TextEncoder(), dec = new TextDecoder();
const PBKDF2_ITER = 600000;
function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function aesSeal(key, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text)); return { iv: b64(iv), ct: b64(ct) }; }
async function aesOpen(key, iv, ct) { return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct))); }

// ---------- Két mật khẩu ----------
async function sealVault() { Object.assign(S.vault, await aesSeal(V.key, JSON.stringify(V.items))); S.vault.u = now(); save(); }
async function openVault(pw) {
  const key = await deriveKey(pw, unb64(S.vault.salt), S.vault.iter);
  V = { key, items: JSON.parse(await aesOpen(key, S.vault.iv, S.vault.ct)) };
}
async function createVault(pw, items = []) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  S.vault = { salt: b64(salt), iter: PBKDF2_ITER };
  V = { key: await deriveKey(pw, salt, PBKDF2_ITER), items };
  await sealVault();
}
function lockVault() { V = null; revealed.clear(); }
function genPassword(len = 18) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*-_=+?';
  return Array.from(crypto.getRandomValues(new Uint32Array(len)), x => chars[x % chars.length]).join('');
}

// ---------- Biểu đồ (SVG, vẽ theo chiều rộng thật) ----------
function niceScale(max) {
  const steps = [5, 10, 15, 30, 60, 120, 180, 240, 300, 600, 900, 1200, 1800, 3000, 6000, 12000, 30000];
  if (max <= 0) return { step: 30, n: 2 };
  for (const s of steps) { const n = Math.floor(max / s) + 1; if (n <= 4) return { step: s, n }; }
  const s = steps[steps.length - 1]; return { step: s, n: Math.floor(max / s) + 1 };
}
const roundTop = (x, y, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
function axes(W, H, L, R, T, B, max) {
  const { step, n } = niceScale(max), top = step * n, ph = H - T - B;
  const y = v => T + ph - v / top * ph; let s = '';
  for (let i = 0; i <= n; i++) { const yy = y(i * step).toFixed(1); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="${i ? 'g' : 'base'}"/><text x="${L - 8}" y="${+yy + 4}" text-anchor="end" class="tk">${fmtShort(i * step)}</text>`; }
  return { y, s };
}
function drawDaily(el, { cur, prev }) {
  const W = el.clientWidth, H = 190, L = 40, R = 2, T = 8, B = 26;
  const { y, s: grid } = axes(W, H, L, R, T, B, Math.max(...cur, ...prev));
  const bw = (W - L - R) / 7, barW = Math.max(4, Math.min(18, (bw - 12) / 2)), base = H - B; let s = grid;
  DOW.forEach((lb, i) => {
    const cx = L + bw * i + bw / 2;
    [[prev[i], 'p', cx - barW - 1, 'Tuần trước'], [cur[i], 'c', cx + 1, 'Tuần này']].forEach(([v, c, x, nm]) => {
      if (v > 0) { const yy = y(v); s += `<path class="${c}" d="${roundTop(x, yy, barW, base - yy, 3)}"><title>${lb} · ${nm}: ${fmtMin(v)}</title></path>`; }
    });
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" class="tk">${lb}</text>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Số phút mỗi ngày, tuần này so với tuần trước">${s}</svg>`;
}
function drawCum(el, weeks) {

async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, {
    ...opt, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + SY.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) }
  });

async function findGist() {
  for (let p = 1; p <= 5; p++) {
    const list = await gh(`/gists?per_page=100&page=${p}`);
    const g = list.find(g => g.files && g.files[GIST_FILE]);
    if (g) return g.id;
    if (list.length < 100) break;
  }

}
// Cùng một chữ có dấu có thể được bàn phím Mac và iPhone mã hóa khác nhau (NFC/NFD),
// nên khi mở dữ liệu thì thử cả hai dạng; khi lưu mới thì luôn dùng dạng NFC.
const passVariants = p => [...new Set([p.normalize('NFC'), p, p.normalize('NFD')])];
async function syncKey(saltB64) {
  if (syncKeyCache && syncKeyCache.salt === saltB64 && syncKeyCache.pass === SY.pass) return syncKeyCache.key;
  const key = await deriveKey(SY.pass.normalize('NFC'), unb64(saltB64), SYNC_ITER);
  syncKeyCache = { salt: saltB64, pass: SY.pass, key, iter: SYNC_ITER };
  return key;
}
async function syncOpen(p) {
  if (syncKeyCache && syncKeyCache.salt === p.salt && syncKeyCache.pass === SY.pass) return aesOpen(syncKeyCache.key, p.iv, p.ct);
  let err;
  for (const v of passVariants(SY.pass)) {
    const key = await deriveKey(v, unb64(p.salt), p.iter || SYNC_ITER);
    try { const t = await aesOpen(key, p.iv, p.ct); syncKeyCache = { salt: p.salt, pass: SY.pass, key, iter: p.iter || SYNC_ITER }; return t; } catch (e) { err = e; }
  }
  throw err;
}
// Dạng chuẩn để so sánh hai trạng thái: mảng sắp theo id.
function canon(s) {
  const c = { ...s }; COLLS.forEach(k => c[k] = [...(s[k] || [])].sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return JSON.stringify(c, Object.keys(c).sort());
}
const ts = o => o.u || o.created || o.added || 0;
function mergeState(a, b) {
  const out = normalize({ ...a });
  const del = { ...(b.del || {}) };
  for (const [k, v] of Object.entries(a.del || {})) del[k] = Math.max(del[k] || 0, v);
  const cutoff = now() - 120 * 864e5; for (const k in del) if (del[k] < cutoff) delete del[k];
  out.del = del;
  for (const c of COLLS) {
    const m = new Map();
    for (const x of [...(a[c] || []), ...(b[c] || [])]) { const y = m.get(x.id); if (!y || ts(x) > ts(y)) m.set(x.id, x); }
    out[c] = [...m.values()].filter(x => !(del[x.id] >= ts(x)));
  }
  const logs = {};
  for (const d of new Set([...Object.keys(a.logs || {}), ...Object.keys(b.logs || {})])) {
    const la = a.logs?.[d] || {}, lb = b.logs?.[d] || {}; logs[d] = {};
    for (const h of new Set([...Object.keys(la), ...Object.keys(lb)])) { const x = la[h], y = lb[h]; logs[d][h] = !x ? y : !y ? x : ((y.u || 0) > (x.u || 0) ? y : x); }
  }
  out.logs = logs;
  if ((b.habitsU || 0) > (a.habitsU || 0)) { out.habits = b.habits; out.habitsU = b.habitsU; }
  if ((b.vault?.u || 0) > (a.vault?.u || 0)) out.vault = b.vault;

}
function syncErrorText(e) {

  if (e.status === 401) return 'Token GitHub không hợp lệ hoặc đã hết hạn';
  if (e.status === 403 || e.status === 404) return 'Token chưa có quyền gist';

async function syncNow(manual) {

  if (syncing) { syncAgain = true; return; }

  try {
    if (!SY.gistId) { SY.gistId = await findGist(); syncStore(); }
    let remote = null, salt = null;
    if (SY.gistId) {
      let g = null;
      try { g = await gh('/gists/' + SY.gistId); } catch (e) { if (e.status === 404) { SY.gistId = null; syncStore(); } else throw e; }
      const f = g?.files?.[GIST_FILE];
      if (f) {
        const txt = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
        if (!syncForce) {
          const p = JSON.parse(txt); salt = p.salt;
          remote = normalize(JSON.parse(await syncOpen(p)));
        }
      }
    }
    const before = canon(S);
    const merged = remote ? mergeState(S, remote) : S;
    const after = canon(merged);
    if (after !== before) {
      const vaultChanged = JSON.stringify(merged.vault) !== JSON.stringify(S.vault);
      S = merged; saveLocal();
      if (vaultChanged) lockVault();
      render();
    }
    if (!remote || canon(remote) !== after) {
      salt = salt || b64(crypto.getRandomValues(new Uint8Array(16)));
      const sealed = await aesSeal(await syncKey(salt), JSON.stringify(S));
      const content = JSON.stringify({ app: 'small-compounding', v: 1, salt, iter: syncKeyCache.iter, ...sealed, at: now() });
      if (SY.gistId) await gh('/gists/' + SY.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content } } }) });
      else { const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Small Compounding: dữ liệu đồng bộ (đã mã hóa)', public: false, files: { [GIST_FILE]: { content } } }) }); SY.gistId = g.id; }
    }
    syncForce = false;
    SY.last = now(); SY.err = null; SY.errCode = null; syncStore(); setSync('ok');
    if (manual) toast('Đã đồng bộ');
  } catch (e) {
    if (unloading) return;
    syncForce = false;
    SY.err = syncErrorText(e); SY.errCode = e.name === 'OperationError' ? 'badpass' : null; syncStore(); setSync('error');
    if (manual) toast(SY.err);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(500); }
  }
}

  },
  delNote(id) { if (confirm('Xóa ghi chú này?')) { remove('notes', id); save(); render(); } },

  readFilter(id) { readFilter = id; render(); },
  delReading(id) { if (confirm('Xóa khỏi danh sách?')) { remove('readings', id); save(); render(); } },
  noteReading(id) {
    const r = S.readings.find(x => x.id === id);
    openDlg(`<h2>${esc(r.title)}</h2><form data-f="saveReadingNote"><input type="hidden" name="id" value="${id}">
      <label class="f">Cảm nhận, ý chính, trích dẫn<textarea name="note">${esc(r.note || '')}</textarea></label>${dlgActs()}</form>`);
  },

  vaultLock() { lockVault(); render(); },
  vaultReveal(id) { revealed.has(id) ? revealed.delete(id) : revealed.add(id); $('#vaultList').innerHTML = vaultListHtml(); },
  vaultCopyUser(id) { copyText(V.items.find(x => x.id === id).user, 'tài khoản'); },
  vaultCopyPass(id) { copyText(V.items.find(x => x.id === id).pass, 'mật khẩu'); },
  vaultEdit(id) { openDlg(vaultItemDlg(id ? V.items.find(x => x.id === id) : null)); },
  genPass() { $('#passIn').value = genPassword(); },
  async vaultDel(id) { if (!confirm('Xóa mật khẩu này?')) return; V.items = V.items.filter(x => x.id !== id); await sealVault(); closeDlg(); render(); },
  vaultChangePw() {
    openDlg(`<h2>Đổi mật khẩu chính</h2><form data-f="vaultNewPw">
      <label class="f">Mật khẩu chính mới<input type="password" name="pw" minlength="8" required autocomplete="new-password"></label>
      <label class="f">Nhập lại<input type="password" name="pw2" minlength="8" required autocomplete="new-password"></label>${dlgActs('Đổi')}</form>`);
  },

  addHabitRow() { const box = $('#habitRows'); box.insertAdjacentHTML('beforeend', habitRow({ id: '', name: '', target: 15 }, 'n' + box.children.length)); box.lastElementChild.querySelector('input').focus(); },
  rmHabitRow(_, b) { b.closest('[data-hrow]').remove(); },
  closeDlg,
  exportData() { download(`small-compounding-${todayStr()}.json`, JSON.stringify(S, null, 1), 'application/json'); toast('Đã xuất bản sao lưu'); },
  importData() { $('#importFile').click(); },
  async persist() {
    if (navigator.storage?.persist) { const ok = await navigator.storage.persist(); toast(ok ? 'Trình duyệt sẽ giữ dữ liệu lâu dài' : 'Trình duyệt chưa cho phép. Hãy cài app ra màn hình chính.'); }
    else toast('Trình duyệt không hỗ trợ tính năng này');
  },
  wipe() {
    if (confirm('Xóa toàn bộ dữ liệu trên máy này? Không thể hoàn tác.') && confirm('Chắc chắn chứ? Hãy xuất bản sao lưu trước nếu cần.')) {
      S = defaultState(); lockVault(); saveLocal(); SY = null; lsSet(SYNC_KEY, 'null'); syncState = 'idle'; render(); toast('Đã xóa dữ liệu trên máy này');
    }
  },
  syncTap() { if (syncOn()) syncNow(true); else A.tab('settings'); },
  syncNow() { syncNow(true); },
  togglePw(_, b) { const i = b.parentElement.querySelector('input'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = ic(show ? 'eye-off' : 'eye', 16); },
  syncOverwrite() {
    const v = $('#syncPass')?.value || '';
    if (v.length < 8) { toast('Nhập mật khẩu đồng bộ mới, ít nhất 8 ký tự'); $('#syncPass')?.focus(); return; }
    if (!confirm('Thay bản trên GitHub bằng dữ liệu của máy này, khóa bằng mật khẩu mới? Trên máy kia bạn sẽ cần nhập mật khẩu mới này.')) return;
    SY.pass = v; syncKeyCache = null; syncForce = true; syncStore(); syncNow(true);
  },
  syncOff() { if (confirm('Ngắt đồng bộ trên máy này? Dữ liệu trên máy và trên GitHub vẫn giữ nguyên.')) { SY = null; lsSet(SYNC_KEY, 'null'); syncState = 'idle'; render(); } }
};

// ---------- Thay đổi ô nhập ----------
const C = {
  habitMin(id, el) { const e = logEntry(todayStr(), id); e.min = Math.max(0, +el.value || 0); if (e.min > 0) e.done = true; touch(e); save(); render(); },
  taskMin(id, el) { const x = findTask(id); x.min = Math.max(0, +el.value || 0); touch(x); save(); },
  readStatus(id, el) { const r = S.readings.find(x => x.id === id); r.status = el.value; r.finished = r.status === 'done' ? (r.finished || todayStr()) : null; touch(r); save(); render(); }
};

// ---------- Gửi form ----------
const F = {
  addTask(fd) { S.tasks.push(touch({ id: uid(), title: fd.get('title').trim(), date: fd.get('date'), done: false, min: 0, created: now() })); save(); render(); focusTaskInput(fd.get('date')); },
  addNote(fd) { const text = fd.get('text').trim(); if (!text) return; S.notes.push(touch({ id: uid(), text, created: now(), pinned: false })); save(); render(); toast('Đã lưu ghi chú'); },
  saveNote(fd) { const n = S.notes.find(x => x.id === fd.get('id')); n.text = fd.get('text').trim(); touch(n); save(); closeDlg(); render(); },
  addReminder(fd) { S.reminders.push(touch({ id: uid(), title: fd.get('title').trim(), at: fd.get('at'), repeat: fd.get('repeat'), done: false, notified: false })); save(); render(); toast('Đã thêm nhắc nhở'); },
  addReading(fd) {
    const status = fd.get('status');
    S.readings.push(touch({ id: uid(), title: fd.get('title').trim(), author: fd.get('author').trim(), link: fd.get('link').trim(), status, note: '', added: now(), finished: status === 'done' ? todayStr() : null }));
    readFilter = status; save(); render();
  },
  saveReadingNote(fd) { const r = S.readings.find(x => x.id === fd.get('id')); r.note = fd.get('note').trim(); touch(r); save(); closeDlg(); render(); },
  saveHabits(fd) {
    const list = [];
    for (const [k, v] of fd.entries()) {
      const m = k.match(/^id_(.+)$/); if (!m) continue;
      const i = m[1], name = (fd.get('name_' + i) || '').trim(); if (!name) continue;
      list.push({ id: v || uid(), name, target: Math.max(0, +fd.get('target_' + i) || 0) });
    }
    S.habits = list; S.habitsU = now(); save(); render(); toast('Đã lưu thói quen');
  },
  async vaultCreate(fd) { if (fd.get('pw') !== fd.get('pw2')) return toast('Hai mật khẩu không khớp'); await createVault(fd.get('pw')); render(); toast('Đã tạo két'); },
  async vaultUnlock(fd, form) {
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Đang mở…';
    try { await openVault(fd.get('pw')); lastActive = now(); render(); }
    catch (e) { btn.disabled = false; btn.textContent = 'Mở khóa'; toast('Sai mật khẩu chính'); }
  },
  async vaultSave(fd) {
    const it = { id: fd.get('id') || uid(), site: fd.get('site').trim(), user: fd.get('user').trim(), pass: fd.get('pass'), note: fd.get('note').trim(), updated: now() };
    const i = V.items.findIndex(x => x.id === it.id); if (i >= 0) V.items[i] = it; else V.items.push(it);
    await sealVault(); closeDlg(); render(); toast('Đã lưu và mã hóa');
  },
  async vaultNewPw(fd) { if (fd.get('pw') !== fd.get('pw2')) return toast('Hai mật khẩu không khớp'); await createVault(fd.get('pw'), V.items); closeDlg(); render(); toast('Đã đổi mật khẩu chính'); },
  syncRepass(fd) { SY.pass = fd.get('pass'); syncKeyCache = null; syncStore(); syncNow(true); },
  async syncSetup(fd, form) {
    SY = { token: fd.get('token').trim(), pass: fd.get('pass') }; syncStore();
    form.querySelector('button').disabled = true;
    await syncNow(true);
    if (tab === 'settings') render();
  }
};
function focusTaskInput(date) {
  const el = document.querySelector(`form[data-f="addTask"] input[name="date"][value="${date}"]`);
  el?.parentElement.querySelector('input[name="title"]')?.focus();
}

// ---------- Kết nối sự kiện ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || !A[b.dataset.a] || b.disabled) return;
  e.preventDefault(); A[b.dataset.a](b.dataset.id, b);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el.dataset.id, el); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault(); F[f.dataset.f](new FormData(f), f); });
document.addEventListener('input', e => {
  if (e.target.id === 'noteQ') { noteQuery = e.target.value; $('#noteList').innerHTML = noteListHtml(); }
  if (e.target.id === 'vaultQ') { vaultQuery = e.target.value; $('#vaultList').innerHTML = vaultListHtml(); }
});
document.addEventListener('keydown', e => {
  lastActive = now();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.tagName === 'TEXTAREA') e.target.form?.requestSubmit();
});
document.addEventListener('pointerdown', () => lastActive = now());
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) closeDlg(); });
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.habits) || typeof data.logs !== 'object') throw new Error('bad');
    if (!confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu này?')) return;
    S = normalize(data); lockVault(); save(); render(); toast('Đã nhập dữ liệu');
  } catch (err) { toast('File sao lưu không hợp lệ'); }
});
// Tự khóa két khi rời app hoặc sau 3 phút không thao tác; đồng bộ khi quay lại.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (V) { lockVault(); if (tab === 'vault') render(); } return; }
  checkReminders(); render(); scheduleSync(300);
});
window.addEventListener('online', () => scheduleSync(500));
setInterval(() => {
  if (V && now() - lastActive > 180e3) { lockVault(); closeDlg(); if (tab === 'vault') render(); toast('Két đã tự khóa'); }
  checkReminders();
}, 15e3);
setInterval(() => { if (!document.hidden) scheduleSync(0); }, 120e3);

// ---------- Vẽ màn hình ----------
const VIEWS = { today: vToday, notes: vNotes, tasks: vTasks, reading: vReading, vault: vVault, week: vWeek, settings: vSettings };
function render() {
  if (!VIEWS[tab]) tab = 'today';
  CH = {};
  renderShell();
  $('#view').innerHTML = VIEWS[tab]();
  drawCharts();
}
render();
checkReminders();
scheduleSync(800);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
</script>
</body>
</html>
